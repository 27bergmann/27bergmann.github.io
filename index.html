<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Berg Hub | Premium Roblox Scripts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://files.catbox.moe/r81dz4.png">
    
    <!-- Optimized CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    
    <style>
        :root {
            --primary: #ff2a2a;
            --primary-glow: rgba(255, 42, 42, 0.6);
            --bg-dark: #050000;
            --card-bg: rgba(15, 0, 0, 0.8);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Animated Background Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a0000 0%, #050000 100%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            z-index: 1;
            perspective: 1000px;
        }

        /* Modern Typography */
        .title {
            font-size: clamp(40px, 8vw, 64px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -3px;
            background: linear-gradient(to bottom, #fff, #ff2a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            margin-bottom: 10px;
            display: block;
        }

        .subtitle {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 42, 42, 0.2);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 42, 42, 0.1);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 42, 42, 0.4);
        }

        .script-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 42, 42, 0.1);
            overflow: hidden;
        }

        .script-box {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            color: #ff9999;
            white-space: pre-wrap;
            word-break: break-all;
            text-align: left;
        }

        /* Performance-optimized Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff2a2a, #8b0000);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 42, 42, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 42, 42, 0.4);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Grid Layouts */
        .grid {
            display: grid;
            gap: 15px;
            margin-top: 25px;
        }

        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }

        .social-link {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .social-link:hover {
            background: rgba(255, 42, 42, 0.1);
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .feature-box:hover {
            background: rgba(255, 42, 42, 0.05);
            border-color: rgba(255, 42, 42, 0.3);
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            background: rgba(255, 42, 42, 0.1);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary);
        }

        /* Pages */
        .page {
            display: none;
            opacity: 0;
        }

        .page.active {
            display: block;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        @media (max-width: 480px) {
            .grid-3 { grid-template-columns: 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <!-- Main Hub Page -->
        <div id="mainPage" class="page active">
            <header style="text-align: center;">
                <h1 class="title">BERG HUB</h1>
                <p class="subtitle">Next-Gen Exploiting</p>
            </header>

            <div class="card">
                <div class="script-container">
                    <div class="script-box" id="mainLoader">loadstring(game:HttpGet("https://27bergmann.github.io/main"))()</div>
                </div>
                
                <button class="btn btn-primary" onclick="copyMainScript()">
                    <i data-lucide="copy" size="20"></i>
                    <span id="copyBtnText">Copy Main Script</span>
                </button>

                <div class="grid grid-3">
                    <a href="https://discord.gg/ZRuJcQmaUJ" class="social-link" target="_blank">
                        <i data-lucide="message-square"></i>
                        <span>Discord</span>
                    </a>
                    <a href="https://www.youtube.com/@ManFaceScript" class="social-link" target="_blank">
                        <i data-lucide="youtube"></i>
                        <span>YouTube</span>
                    </a>
                    <a href="#" class="social-link" onclick="switchPage('feedbackPage')">
                        <i data-lucide="pen-tool"></i>
                        <span>Feedback</span>
                    </a>
                </div>

                <div class="grid grid-2">
                    <div class="feature-box" onclick="switchPage('gamesPage')">
                        <div class="icon-circle"><i data-lucide="gamepad-2"></i></div>
                        <div style="text-align: left;">
                            <p style="font-weight: 700; font-size: 14px;">Games</p>
                            <p style="font-size: 11px; opacity: 0.6;">Supported Titles</p>
                        </div>
                    </div>
                    <div class="feature-box" onclick="switchPage('executorsPage')">
                        <div class="icon-circle"><i data-lucide="zap"></i></div>
                        <div style="text-align: left;">
                            <p style="font-weight: 700; font-size: 14px;">Executors</p>
                            <p style="font-size: 11px; opacity: 0.6;">Recommended</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Games Page -->
        <div id="gamesPage" class="page">
            <button class="btn" style="background: transparent; color: white; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);" onclick="switchPage('mainPage')">
                <i data-lucide="arrow-left"></i> Back to Hub
            </button>
            <h2 style="margin-bottom: 20px; font-weight: 800; letter-spacing: -1px;">SUPPORTED GAMES</h2>
            <div class="grid">
                <div class="card" style="padding: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
                    <img src="https://files.catbox.moe/r81dz4.png" width="50" height="50" style="border-radius: 10px; border: 1px solid var(--primary);">
                    <div style="flex: 1; text-align: left;">
                        <h3 style="font-size: 16px;">MM2 (Murder Mystery)</h3>
                        <p style="font-size: 12px; color: #7fff7f;">● Updated & Working</p>
                    </div>
                </div>
                <!-- Add more game cards as needed -->
            </div>
        </div>

        <!-- Feedback Page -->
        <div id="feedbackPage" class="page">
             <button class="btn" style="background: transparent; color: white; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);" onclick="switchPage('mainPage')">
                <i data-lucide="arrow-left"></i> Cancel
            </button>
            <div class="card">
                <h2 style="margin-bottom: 15px;">SUBMIT FEEDBACK</h2>
                <textarea id="feedbackText" placeholder="Tell us what you think or report a bug..." style="width: 100%; height: 150px; background: #000; border: 1px solid rgba(255,42,42,0.2); border-radius: 12px; padding: 15px; color: white; margin-bottom: 15px; resize: none;"></textarea>
                <button class="btn btn-primary" onclick="submitFeedback()">
                    <i data-lucide="send"></i> Send Feedback
                </button>
            </div>
        </div>
    </div>

    <script>
        // Performance-friendly Particle System
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 42, 42, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            const count = window.innerWidth < 480 ? 40 : 80;
            particles = Array.from({ length: count }, () => new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // UI Logic
        lucide.createIcons();

        function switchPage(pageId) {
            const pages = document.querySelectorAll('.page');
            const target = document.getElementById(pageId);
            
            gsap.to(pages, { 
                opacity: 0, 
                y: 10, 
                duration: 0.3, 
                onComplete: () => {
                    pages.forEach(p => p.classList.remove('active'));
                    target.classList.add('active');
                    gsap.fromTo(target, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 });
                }
            });
        }

        function copyMainScript() {
            const scriptText = document.getElementById('mainLoader').innerText;
            navigator.clipboard.writeText(scriptText).then(() => {
                const btn = document.querySelector('.btn-primary');
                const text = document.getElementById('copyBtnText');
                const originalText = text.innerText;
                
                text.innerText = "COPIED!";
                btn.style.background = "linear-gradient(135deg, #00c853, #1b5e20)";
                
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff2a2a', '#ffffff']
                });

                setTimeout(() => {
                    text.innerText = originalText;
                    btn.style.background = "";
                }, 2000);
            });
        }

        function submitFeedback() {
            const text = document.getElementById('feedbackText').value;
            if (!text.trim()) return;

            // Mock submission
            const btn = document.querySelector('#feedbackPage .btn-primary');
            btn.disabled = true;
            btn.innerText = "Sending...";

            setTimeout(() => {
                alert("Thank you for your feedback!");
                document.getElementById('feedbackText').value = "";
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send"></i> Send Feedback';
                lucide.createIcons();
                switchPage('mainPage');
            }, 1000);
        }

        // Entrance Animations
        gsap.from(".title", { duration: 1, y: -50, opacity: 0, ease: "back.out(1.7)" });
        gsap.from(".subtitle", { duration: 1, delay: 0.2, opacity: 0 });
        gsap.from(".card", { duration: 0.8, delay: 0.4, scale: 0.9, opacity: 0, ease: "power4.out" });
    </script>
</body>
</html>
